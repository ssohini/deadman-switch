name: Deadman Switch CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  contract-build-and-test:
    name: Build & Test Smart Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contract/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --version 21.0.0 --features opt

      - name: Build contract (WASM)
        working-directory: contract
        run: |
          cargo build --release --target wasm32-unknown-unknown
          echo "WASM artifact:"
          ls -lh target/wasm32-unknown-unknown/release/deadman_switch.wasm

      - name: Run unit tests
        working-directory: contract
        run: cargo test

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: deadman_switch_wasm
          path: contract/target/wasm32-unknown-unknown/release/deadman_switch.wasm
          retention-days: 7
